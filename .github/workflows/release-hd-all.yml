name: release-hd-all

# All Meguarace HD builds. Separate from release-all: the standard builds
# stay without HD until it merges into master as an option.

on: workflow_dispatch

jobs:
  linux:
    uses: ./.github/workflows/release-hd-linux.yml

  windows:
    uses: ./.github/workflows/release-hd-windows.yml

  mac-osx:
    uses: ./.github/workflows/release-hd-mac-osx.yml
    secrets: inherit
