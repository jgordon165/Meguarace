# The Sega Saturn build (libyaul, SH-2). Makes A.BIN and IP.BIN, packages
# them with the disc builder (tools/saturn_disc.py) and the Lua scripts as
# meguarace-saturn.zip, and boots the build in an emulator on a synthetic
# MEGARACE.DAT (test patterns made by tests/saturn/make_test_dat.py: no game
# data, and no Sega BIOS: Yabause's HLE BIOS), checking the picture and
# sound, and that the Saturn's Lua runs the Lua test suite exactly as the
# PC does (docs/saturn.md).
name: saturn

on:
  push:
    branches: [master, saturn]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: /opt/tool-chains/sh2eb-elf

jobs:
  saturn:
    name: Saturn (libyaul)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q texinfo flex bison xorriso libgmp-dev libmpfr-dev libmpc-dev python3-numpy python3-pil
      - name: Tool-chain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: /opt/tool-chains/sh2eb-elf
          key: sh2eb-elf-gcc14.3.0-binutils2.44-${{ hashFiles('platform/saturn/toolchain/build-toolchain.sh') }}
      - name: Tool-chain (GCC 14.3 for SH-2, libyaul)
        run: |
          sudo mkdir -p "$PREFIX" && sudo chown "$USER" "$PREFIX"
          platform/saturn/toolchain/build-toolchain.sh "$RUNNER_TEMP/sh2"
      - name: Build
        run: |
          . ~/.yaul.env
          make -C platform/saturn
          ls -la platform/saturn/build/A.BIN platform/saturn/build/IP.BIN
      - name: Emulator test (synthetic data)
        run: tests/saturn/run_emulator_test.sh platform/saturn/build "$RUNNER_TEMP/emu"
      - name: Package
        run: |
          mkdir -p pkg/meguarace-saturn
          cp platform/saturn/build/A.BIN platform/saturn/build/IP.BIN \
             platform/saturn/build/ABS.TXT platform/saturn/build/BIB.TXT \
             platform/saturn/build/CPY.TXT tools/saturn_disc.py pkg/meguarace-saturn/
          cp -r scripts pkg/meguarace-saturn/scripts
          cp platform/saturn/README-saturn.txt pkg/meguarace-saturn/README.txt
          cp platform/saturn/THIRD-PARTY.txt pkg/meguarace-saturn/
          (cd pkg && zip -qr ../meguarace-saturn.zip meguarace-saturn)
      - uses: actions/upload-artifact@v4
        with:
          name: meguarace-saturn
          path: meguarace-saturn.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saturn-emulator-run
          path: |
            ${{ runner.temp }}/emu/run_*.ppm
            ${{ runner.temp }}/emu/run.wav
            ${{ runner.temp }}/emu/lua_*.ppm
            ${{ runner.temp }}/emu/lua_pc.txt
          if-no-files-found: ignore
