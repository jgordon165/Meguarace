name: release-windows

on:
  workflow_dispatch:
  workflow_call:
    # Meguarace_Builds (a private repo) calls these with Meguarace's own
    # source: the checkouts take it, and the local actions come with it.
    inputs:
      source_repository:
        description: repository to build (default this one)
        type: string
        default: ""
      source_ref:
        description: branch, tag or commit (default the default branch)
        type: string
        default: ""


jobs:
  release-x64:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        repository: ${{ inputs.source_repository || github.repository }}
        ref: ${{ inputs.source_ref }}

    - name: Build
      uses: ./.github/actions/build-windows
      with:
        platform: x64
        configurations: Release

    - name: Run Tests
      uses: ./.github/actions/run-tests

    - name: Build archive
      id: package
      uses: ./.github/actions/package
      with:
        name: meguarace-windows-x64

    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: meguarace-windows-release-x64
        if-no-files-found: error
        path: dist/*.zip

    - name: Upload debugging symbols
      uses: actions/upload-artifact@v6
      with:
        name: meguarace-windows-symbols-x64
        path: build/Release/*.pdb

  release-x86:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        repository: ${{ inputs.source_repository || github.repository }}
        ref: ${{ inputs.source_ref }}

    - name: Build
      uses: ./.github/actions/build-windows
      with:
        platform: x86
        configurations: Release

    - name: Run Tests
      uses: ./.github/actions/run-tests

    - name: Build archive
      uses: ./.github/actions/package
      with:
        name: meguarace-windows-x86

    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: meguarace-windows-release-x86
        if-no-files-found: error
        path: dist/*.zip

    - name: Upload debugging symbols
      uses: actions/upload-artifact@v6
      with:
        name: meguarace-windows-symbols-x86
        path: build/Release/*.pdb
