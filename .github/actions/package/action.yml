name: package
description: install the build into a staging folder and archive it (no game data)

inputs:
  name:
    description: archive base name, e.g. meguarace-windows-x64
    required: true
  configuration:
    required: false
    default: Release
  format:
    description: zip or tar.gz
    required: false
    default: zip
  component:
    description: "install component: game (the game package) or converter (hd-conversion-utility)"
    required: false
    default: game
  staged:
    description: "true if stage/Meguarace is already installed (the converter package adds Real-ESRGAN to it first)"
    required: false
    default: "false"

outputs:
  path:
    description: path of the archive
    value: ${{steps.archive.outputs.path}}

runs:
  using: "composite"
  steps:
    - name: Install to staging folder
      if: inputs.staged != 'true'
      run: cmake --install build --config ${{inputs.configuration}} --component ${{inputs.component}} --prefix "stage/Meguarace"
      shell: bash

    # Packages hold tools and engine code only. Fail if anything that looks
    # like game data or an HD pack (derived game content) got staged.
    - name: Check for game content
      run: |
        bad=$(find stage -type f \( -iname '*.hdv' -o -iname '*.hnm' -o -iname '*.dat' -o -iname '*.hsq' -o -iname '*.exe' -a ! -iname 'megarace.exe' -a ! -iname 'hd-conversion-utility.exe' -a ! -iname 'realesrgan-ncnn-vulkan.exe' \) )
        if [ -n "$bad" ]; then echo "game content in the package:"; echo "$bad"; exit 1; fi
      shell: bash

    - name: Archive
      id: archive
      run: |
        version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
        mkdir -p dist
        out="dist/${{inputs.name}}-$version.${{inputs.format}}"
        case "${{inputs.format}}" in
          zip)
            if command -v 7z >/dev/null; then (cd stage && 7z a -tzip "../$out" Meguarace >/dev/null)
            else (cd stage && zip -qr "../$out" Meguarace); fi ;;
          tar.gz) tar -C stage -czf "$out" Meguarace ;;
        esac
        echo "path=$out" >> "$GITHUB_OUTPUT"
        ls -l dist
      shell: bash
