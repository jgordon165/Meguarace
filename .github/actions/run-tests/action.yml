name: run-tests
description: cross-platform action to run the Meguarace tests

inputs:
  build_dir:
    required: false
    default: build
  configuration:
    description: CMake configuration (multi-config generators such as Visual Studio)
    required: false
    default: Release

runs:
  using: "composite"
  steps:
    # The repository contains no MegaRace data, so only the data-free tests
    # run here (format decoders, Lua modules, booting to the no-data screen).
    # Tests marked [data] run locally when MEGARACE_DATA is set at configure.
    - name: Run tests
      run: ctest --test-dir "${{inputs.build_dir}}" -C ${{inputs.configuration}} --output-on-failure
      shell: pwsh
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
